<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc"><title id="title">ZeroPay Payment Orchestration</title><desc id="desc">A cobalt and mint payment banner showing payment session, direct rails, optional gateways, matching, and traceable operations.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1b31"/><stop offset="1" stop-color="#1f6581"/></linearGradient><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".07"/></pattern><style>.t{font:700 45px Segoe UI,Arial;fill:#f5fbff}.s{font:600 15px Segoe UI,Arial;letter-spacing:2.2px;fill:#d7f0ee}.e{font:700 12px Segoe UI,Arial;letter-spacing:2.3px;fill:#96f1d5}.l{font:700 12px Segoe UI,Arial;fill:#fff}.q{font:400 11px Segoe UI,Arial;fill:#bfdedc}</style></defs><rect width="1200" height="360" rx="22" fill="url(#bg)"/><rect width="1200" height="360" rx="22" fill="url(#grid)"/><circle cx="1090" cy="35" r="220" fill="#96f1d5" opacity=".11"/><text x="70" y="66" class="e">ZEROPAY � PAYMENT ORCHESTRATION � DIRECT RAILS FIRST</text><text x="70" y="125" class="t">ZeroPay</text><text x="72" y="160" class="s">SESSION    RAIL ADAPTERS    MATCHING    EVIDENCE    OPERATOR CONTROL</text><path d="M110 245H1090" stroke="#4e93a6" stroke-width="2"/><path d="M144 245H1050" stroke="#96f1d5" stroke-width="3"/><g><circle cx="144" cy="245" r="24" fill="#194863" stroke="#96f1d5" stroke-width="2"/><text x="144" y="250" text-anchor="middle" class="l">01</text><text x="144" y="292" text-anchor="middle" class="l">Session</text><text x="144" y="312" text-anchor="middle" class="q">QR � link � context</text><circle cx="383" cy="245" r="24" fill="#194863" stroke="#96f1d5" stroke-width="2"/><text x="383" y="250" text-anchor="middle" class="l">02</text><text x="383" y="292" text-anchor="middle" class="l">Direct rails</text><text x="383" y="312" text-anchor="middle" class="q">PayID � bank � cash � crypto</text><circle cx="622" cy="245" r="24" fill="#194863" stroke="#96f1d5" stroke-width="2"/><text x="622" y="250" text-anchor="middle" class="l">03</text><text x="622" y="292" text-anchor="middle" class="l">Gateways</text><text x="622" y="312" text-anchor="middle" class="q">Stripe � PayPal optional</text><circle cx="861" cy="245" r="24" fill="#194863" stroke="#96f1d5" stroke-width="2"/><text x="861" y="250" text-anchor="middle" class="l">04</text><text x="861" y="292" text-anchor="middle" class="q">Match deposits</text><circle cx="1050" cy="245" r="24" fill="#3d5553" stroke="#f0c47a" stroke-width="2"/><text x="1050" y="250" text-anchor="middle" class="l">05</text><text x="1050" y="292" text-anchor="middle" class="l">Review</text><text x="1050" y="312" text-anchor="middle" class="q">exceptions + audit</text></g><text x="70" y="342" class="q">Zero-fee-first, not fee-free by guarantee � providers and rails remain configurable</text></svg>

