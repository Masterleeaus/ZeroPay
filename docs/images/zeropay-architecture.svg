<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760" role="img" aria-labelledby="title desc"><title id="title">ZeroPay Payment Orchestration architecture</title><desc id="desc">Customer and seller surfaces create a payment session, route to direct or optional gateway adapters, and flow through transaction lifecycle, matching, evidence, notifications, and operator controls.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1b31"/><stop offset="1" stop-color="#1f6581"/></linearGradient><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#96f1d5"/></marker><style>.e{font:700 13px Segoe UI,Arial;letter-spacing:2px;fill:#96f1d5}.t{font:700 32px Segoe UI,Arial;fill:#f5fbff}.s{font:400 15px Segoe UI,Arial;fill:#d7f0ee}.n{fill:#194863;stroke:#4e93a6;stroke-width:2}.g{fill:#1f6581;stroke:#96f1d5;stroke-width:2}.y{fill:#3d5553;stroke:#f0c47a;stroke-width:2}.l{font:700 16px Segoe UI,Arial;fill:#fff}.b{font:400 13px Segoe UI,Arial;fill:#d3edeb}.q{font:400 12px Segoe UI,Arial;fill:#b8d8d5}.r{stroke:#96f1d5;stroke-width:3;fill:none;marker-end:url(#a)}</style></defs><rect width="1500" height="760" rx="26" fill="url(#bg)"/><text x="64" y="58" class="e">ZEROPAY � TRACEABLE PAYMENT LIFECYCLE</text><text x="64" y="106" class="t">Keep the rail replaceable; keep the transaction model stable</text><text x="64" y="136" class="s">Source-backed from Mobile/, PWA/, Web/, Modules/ZeroPayModule/, adapters, gateway registry, and bank matching service.</text><rect x="70" y="220" width="250" height="130" rx="16" class="n"/><text x="195" y="260" text-anchor="middle" class="l">Customer / seller surface</text><text x="195" y="290" text-anchor="middle" class="b">mobile � web � PWA � API</text><text x="195" y="318" text-anchor="middle" class="q">QR � link � payment instructions</text><path d="M320 285H430" class="r"/><rect x="430" y="220" width="250" height="130" rx="16" class="g"/><text x="555" y="260" text-anchor="middle" class="l">Payment session</text><text x="555" y="290" text-anchor="middle" class="b">business context + lifecycle</text><text x="555" y="318" text-anchor="middle" class="q">open � complete � fail � expire</text><path d="M680 285H790" class="r"/><rect x="790" y="150" width="250" height="110" rx="16" class="g"/><text x="915" y="188" text-anchor="middle" class="l">Direct rails</text><text x="915" y="218" text-anchor="middle" class="b">PayID � bank � cash � crypto</text><rect x="790" y="300" width="250" height="110" rx="16" class="n"/><text x="915" y="338" text-anchor="middle" class="l">Optional gateways</text><text x="915" y="368" text-anchor="middle" class="b">Stripe � PayPal adapters</text><path d="M1040 205H1150M1040 355H1150" class="r"/><rect x="1150" y="220" width="280" height="190" rx="16" class="y"/><text x="1290" y="260" text-anchor="middle" class="l">Lifecycle + reconciliation</text><text x="1290" y="294" text-anchor="middle" class="b">transactions � webhooks</text><text x="1290" y="322" text-anchor="middle" class="b">deposit matching � exceptions</text><text x="1290" y="350" text-anchor="middle" class="q">evidence � notifications � audit</text><path d="M1290 410V520H950" class="r"/><rect x="650" y="540" width="600" height="92" rx="16" class="n"/><text x="950" y="577" text-anchor="middle" class="l">Operator control + governed agent contract</text><text x="950" y="604" text-anchor="middle" class="q">tenant scope � confirmation before writes � no live rail in fixture checks</text></svg>

