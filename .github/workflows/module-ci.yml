name: ZeroPayModule CI

on:
  push:
    paths:
      - 'Modules/ZeroPayModule/**'
      - '.github/workflows/module-ci.yml'
  pull_request:
    paths:
      - 'Modules/ZeroPayModule/**'
      - '.github/workflows/module-ci.yml'

permissions:
  contents: read

jobs:
  lint-and-validate:
    name: PHP Lint, Dependency Boundary & Module Structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer:2.10.3
          coverage: none

      - name: Require committed module lock
        shell: bash
        run: |
          test -s Modules/ZeroPayModule/composer.lock             || (echo "Modules/ZeroPayModule/composer.lock is required" && exit 1)

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: Modules/ZeroPayModule/vendor
          key: composer-${{ runner.os }}-${{ hashFiles('Modules/ZeroPayModule/composer.json', 'Modules/ZeroPayModule/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - name: Validate library dependency boundary
        working-directory: Modules/ZeroPayModule
        run: composer validate --strict --no-check-publish

      - name: Install locked Composer dependencies
        working-directory: Modules/ZeroPayModule
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Run provider-independent agent contract check
        run: php Modules/ZeroPayModule/Tests/Contract/run_agent_contract_checks.php

      - name: PHP syntax check
        shell: bash
        run: |
          find Modules/ZeroPayModule -type f -name '*.php' -print0             | xargs -0 -n1 php -l

      - name: Check code style with Laravel Pint
        working-directory: Modules/ZeroPayModule
        run: ./vendor/bin/pint --test

      - name: Validate module.json structure
        working-directory: Modules/ZeroPayModule
        run: |
          echo "Checking module.json exists..."
          test -f module.json || (echo "module.json not found" && exit 1)

          echo "Validating required fields in module.json..."
          jq -e '.name' module.json > /dev/null || (echo "Missing: .name" && exit 1)
          jq -e '.alias' module.json > /dev/null || (echo "Missing: .alias" && exit 1)
          jq -e '.providers | length > 0' module.json > /dev/null || (echo "Missing or empty: .providers" && exit 1)
          jq -e '.permissions | length > 0' module.json > /dev/null || (echo "Missing or empty: .permissions" && exit 1)
          jq -e '.manifest' module.json > /dev/null || (echo "Missing: .manifest" && exit 1)
          echo "module.json structure is valid."

      - name: Run PHPUnit tests
        working-directory: Modules/ZeroPayModule
        run: ./vendor/bin/phpunit --testdox Tests/
